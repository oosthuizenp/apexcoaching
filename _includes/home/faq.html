<section id="faq" class="faq">
  <div class="container">
    <h2 class="section-heading">{{ site.data.sitetext.home.faq.heading }}</h2>
    {% for item in site.data.sitetext.home.faq.items %}
    <div class="faq__item">
      <h3 class="faq__question">{{ item.question }}</h3>
      <p class="faq__answer">{{ item.answer }}</p>
    </div>
    {% endfor %}
  </div>
</section>
