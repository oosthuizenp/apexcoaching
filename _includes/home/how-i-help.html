<section id="howihelp" class="section--text section--inverse">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <h2 class="section-heading">{{ site.data.sitetext.home.how_i_help.heading }}</h2>
        <div class="row">
          <div class="col-md-6">
            {% for para in site.data.sitetext.home.how_i_help.intro %}
            <p>{{ para }}</p>
            {% endfor %}
          </div>
          <div class="col-md-6">
            <p>The people who benefit the most from my coaching are:</p>
            <ul>
              {% for benefit in site.data.sitetext.home.how_i_help.benefits %}
              <li>{{ benefit }}</li>
              {% endfor %}
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
