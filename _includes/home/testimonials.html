<section id="testimonials" class="testimonials">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <h2 class="section-heading">{{ site.data.sitetext.home.testimonials.heading }}</h2>
        {% for item in site.data.sitetext.home.testimonials.items %}
        <div class="testimonial">
          {% if item.image %}
          <img src="{{ item.image }}" class="testimonial__img" alt="{{ item.name }}, {{ item.company }}" loading="lazy">
          {% endif %}
          <h3>{{ item.name }}{% if item.role %}, {{ item.role }}{% endif %}</h3>
          <h4>{{ item.company }}</h4>
          <p>
            <i class="bx bxs-quote-alt-left testimonial__quote"></i>
            {{ item.quote }}
            <i class="bx b-xs-quote-alt-right testimonial__quote--right"></i>
          </p>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>
</section>
