<section id="whatido" style="background-color: #eee">
  <div class="container">
    <div class="row services">
      <div class="col-lg-12">
        <h2 class="section-heading">{{ site.data.sitetext.home.services.heading }}</h2>
        <div class="row">
          {% for service in site.data.sitetext.home.services %}
          <div class="col-md-4">
            <div class="service-box">
              <div class="service-box__icon"><i class="fa {{ service.icon }} fa-lg"></i></div>
              <h5>{{ service.title }}</h5>
              <p>{{ service.text }}</p>
            </div>
          </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</section>
