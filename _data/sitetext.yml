  faq:
    heading: "Frequently Asked Questions"
    items:
      - question: "What does a coaching engagement look like?"
        answer: "Sessions are typically one hour and can be held in person in Durban or Umhlanga, or remotely. We begin by understanding your context and goals, then build practical rhythms, routines and habits that create lasting change."
      - question: "Who is coaching for?"
        answer: "Leaders developing their ability to self-lead, new leaders finding their style, people navigating relational complexity at work, and anyone wanting intentional rhythms and habits in their life and work."
      - question: "Is what we discuss kept confidential?"
        answer: "Yes. Coaching is a safe, confidential space. What you share is held in confidence, and you remain in control of your own goals and the actions you commit to."
      - question: "How do we get started?"
        answer: "Reach out via the contact details on the site for an initial conversation. There is no obligation; we simply explore whether coaching is the right fit for where you are right now."

